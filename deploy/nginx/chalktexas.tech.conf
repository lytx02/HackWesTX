# /etc/nginx/sites-available/chalktexas.tech
#
# One box: Nginx serves the React build from /var/www/chalktexas.tech and
# forwards /api/ to the Node API on 127.0.0.1:4000. Certbot rewrites this file
# to add the HTTPS server block and the HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name chalktexas.tech www.chalktexas.tech;

    root /var/www/chalktexas.tech;
    index index.html;

    # API. The trailing slash on proxy_pass strips the /api prefix, so
    # https://chalktexas.tech/api/me reaches Express as /me.
    location /api/ {
        proxy_pass http://127.0.0.1:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: any unknown path serves index.html so /auth, /dashboard,
    # /class/... work on a direct load or refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
